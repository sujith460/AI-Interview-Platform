spring.application.name=DSA

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

judge0.api.base-url=${JUDGE0_BASE_URL:http://localhost:2358}
judge0.api.submissions-endpoint=/submissions

ai.api.key=${GEMINI_API_KEY}
ai.api.base-url=https://generativelanguage.googleapis.com
ai.api.model=gemini-3.5-flash-lite
ai.api.timeout=60s

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.format_sql=true

# ── Spring Mail (Gmail SMTP) ──────────────────────────────────────────────────
# Set MAIL_USERNAME and MAIL_PASSWORD in your .env file
# For Gmail: use an App Password from https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000